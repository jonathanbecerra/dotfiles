set -g default-terminal 'tmux-256color'
# xterm* includes Ghostty. Keep tmux's own TERM inside panes.
set -as terminal-features ',xterm*:RGB'
# zsh expects traditional control bytes; do not forward tmux CSI-u keys to it.
set -s extended-keys off
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -s escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

unbind %
unbind '"'
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind f popup -B -w 60% -h 40% -E 'bash "$HOME/.config/tmux/choose-session.sh" #{q:client_name}'

set -g @rose_pine_variant 'main'
set -g @rose_pine_host 'on'
set -g @rose_pine_hostname_short 'on'
set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_default_window_behavior 'on'
set -g @rose_pine_window_separator ' - '
run-shell -b '${XDG_DATA_HOME:-$HOME/.local/share}/tmux/rose-pine/rose-pine.tmux'

source-file -q ~/.tmux.conf.local
